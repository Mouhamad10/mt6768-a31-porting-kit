name: ELF symbol comparison tests
on:
  push:
    paths:
      - 'tools/elf_symbol_compare.py'
      - 'tests/test_elf_symbol_compare.py'
      - '.github/workflows/elf-symbol-compare-tests.yml'
  pull_request:
    paths:
      - 'tools/elf_symbol_compare.py'
      - 'tests/test_elf_symbol_compare.py'
      - '.github/workflows/elf-symbol-compare-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y binutils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_elf_symbol_compare.py' -v
