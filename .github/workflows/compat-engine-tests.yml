name: Compatibility Engine Tests
on:
  push:
    branches: [main, feature/stages-9-10-compatibility-engine]
    paths:
      - tools/compat_engine.py
      - tools/hal_vendor_analyzer.py
      - tools/port_validator.py
      - tests/test_compat_engine.py
      - tests/test_stages_11_12.py
      - .github/workflows/compat-engine-tests.yml
  pull_request:
    paths:
      - tools/compat_engine.py
      - tools/hal_vendor_analyzer.py
      - tools/port_validator.py
      - tests/test_compat_engine.py
      - tests/test_stages_11_12.py
      - .github/workflows/compat-engine-tests.yml
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
