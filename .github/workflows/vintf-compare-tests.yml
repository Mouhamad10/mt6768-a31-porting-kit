name: Static VINTF comparison tests
on:
  push:
    paths:
      - 'tools/vintf_compare.py'
      - 'tests/test_vintf_compare.py'
      - '.github/workflows/vintf-compare-tests.yml'
  pull_request:
    paths:
      - 'tools/vintf_compare.py'
      - 'tests/test_vintf_compare.py'
      - '.github/workflows/vintf-compare-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_vintf_compare.py' -v
