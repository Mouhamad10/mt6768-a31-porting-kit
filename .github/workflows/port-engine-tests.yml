name: A31 GSI Port Engine validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install image tooling
        run: sudo apt-get update && sudo apt-get install -y android-sdk-libsparse-utils xz-utils lz4 p7zip-full file e2fsprogs erofs-utils f2fs-tools
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Filesystem inspector smoke test
        run: |
          python3 - <<'PY'
          import pathlib
          from tools.gsi_fs_inspect import inspect
          p=pathlib.Path('unknown.img')
          p.write_bytes(b'unknown')
          x=inspect(p)
          assert x['filesystem']=='unknown' and x['compatibility']=='not_assessed'
          p.unlink()
          PY
      - name: Analyzer CLI smoke test
        run: |
          printf 'not an image' > sample.bin
          python3 tools/gsi_analyze.py sample.bin --json report.json
          python3 -c 'import json; x=json.load(open("report.json")); assert x["type"]=="unknown" and x["compatibility"]=="not assessed"'
