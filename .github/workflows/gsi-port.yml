name: Port GSI for A31 (SM-A315F)
on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: Direct URL for GSI/image/archive
        required: true
      label:
        description: Output label
        default: gsi
      lcd_density:
        description: Desired density (currently recorded, future recipe hook)
        default: "420"
      output_format:
        description: Future rebuild target; current pipeline preserves source FS
        default: auto
jobs:
  port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install intake tools
        run: sudo apt-get update && sudo apt-get install -y android-sdk-libsparse-utils xz-utils unzip wget lz4 python3 file p7zip-full
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Download GSI
        env:
          GSI_URL: ${{ github.event.inputs.gsi_url }}
        run: |
          set -euo pipefail
          mkdir work
          wget --tries=3 --timeout=120 --no-verbose -O work/source "$GSI_URL"
          test -s work/source
          sha256sum work/source > work/source.sha256
      - name: Normalize if possible, retain source on unsupported input
        run: |
          set -euo pipefail
          python3 tools/gsi_prepare.py work/source work/system.img | tee work/fs.txt
          test -s work/system.img
          sha256sum work/system.img > work/system.sha256
      - name: Package
        run: |
          set -euo pipefail
          OUT="system-a31-${{ github.event.inputs.label }}"
          mkdir -p work/dist
          split -b 1900M -d work/system.img "work/dist/${OUT}.img.part."
          printf 'Detected FS: %s\nRequested density: %s\nRecipe status: pending verified A31-specific recipe\nDevice boot status: not tested\n' "$(cat work/fs.txt)" "${{ github.event.inputs.lcd_density }}" > work/dist/PORT-STATUS.txt
          cp work/source.sha256 work/system.sha256 work/dist/
          cat > work/dist/HOW-TO-REJOIN.txt <<EOF
          Rejoin: cat ${OUT}.img.part.* > system.img
          The pipeline normalizes and packages; it does not claim a device-tested port.
          EOF
          cat work/dist/PORT-STATUS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: a31-gsi-port-output
          path: work/dist/*
