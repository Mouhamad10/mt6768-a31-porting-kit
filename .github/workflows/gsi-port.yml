name: Port GSI for A31 (SM-A315F)
on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: Direct URL for GSI/image/archive
        required: true
      label:
        description: Output label
        default: gsi
      lcd_density:
        description: Desired density (currently recorded, future recipe hook)
        default: "420"
      output_format:
        description: Future rebuild target; current pipeline preserves source FS
        default: auto
      max_bytes:
        description: Expanded payload limit in bytes; set larger for big GSIs
        required: false
        default: "8589934592"
jobs:
  port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install intake tools
        run: |
          sudo find /etc/apt/sources.list.d -type f -exec grep -l 'packages.microsoft.com' {} + | while read -r f; do sudo mv "$f" "$f.disabled"; done
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils xz-utils unzip wget lz4 python3 file p7zip-full
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Download GSI
        env:
          GSI_URL: ${{ github.event.inputs.gsi_url }}
        run: |
          set -euo pipefail
          mkdir work
          wget --tries=3 --timeout=120 --no-verbose -O work/source "$GSI_URL"
          test -s work/source
          sha256sum work/source > work/source.sha256
      - name: Bounded normalize and preserve intake report
        run: |
          set -euo pipefail
          mkdir -p work/extract
          python3 tools/gsi_extract.py work/source work/extract --max-bytes "${{ github.event.inputs.max_bytes }}" | tee work/extract-report.stdout.json
          cp work/extract/system.img work/system.img
          test -s work/system.img
          python3 -c 'import json; r=json.load(open("work/extract/extract-report.json")); print("Filesystem:",r["filesystem_hint"])' | tee work/fs.txt
          cp work/extract/extract-report.json work/dist-extract-report.json
          sha256sum work/system.img > work/system.sha256
      - name: Package
        run: |
          set -euo pipefail
          OUT="system-a31-${{ github.event.inputs.label }}"
          mkdir -p work/dist
          split -b 1900M -d work/system.img "work/dist/${OUT}.img.part."
          printf 'Detected FS: %s\nRequested density: %s\nRecipe status: pending verified A31-specific recipe\nDevice boot status: not tested\n' "$(cat work/fs.txt)" "${{ github.event.inputs.lcd_density }}" > work/dist/PORT-STATUS.txt
          cp work/source.sha256 work/system.sha256 work/dist/
          cp work/dist-extract-report.json work/dist/extract-report.json
          cat > work/dist/HOW-TO-REJOIN.txt <<EOF
          Rejoin: cat ${OUT}.img.part.* > system.img
          The pipeline normalizes and packages; it does not claim a device-tested port.
          EOF
          cat work/dist/PORT-STATUS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: a31-gsi-port-output
          path: work/dist/*
