name: Port GSI for A31 (SM-A315F)
on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: Direct URL to GSI image or archive
        required: true
      label:
        description: Output label
        default: gsi
      lcd_density:
        description: Requested density (reported only; not silently applied)
        default: "420"
jobs:
  port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {path: kit}
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y android-sdk-libsparse-utils xz-utils unzip wget lz4 python3 file
      - name: Unit tests
        run: cd kit && python3 -m unittest discover -s tests -v
      - name: Download source
        env:
          GSI_URL: ${{ github.event.inputs.gsi_url }}
        run: |
          set -euo pipefail
          mkdir work
          wget --tries=3 --timeout=120 --no-verbose -O work/source "$GSI_URL"
          test -s work/source
          if file work/source | grep -qiE 'HTML|ASCII text'; then echo "::error::Not an image download"; exit 1; fi
          sha256sum work/source > work/source.sha256
      - name: Normalize and validate
        run: |
          set -euo pipefail
          python3 kit/tools/gsi_prepare.py work/source work/system.img | tee work/fs.txt
          sha256sum work/system.img > work/system.sha256
      - name: Package with explicit status
        run: |
          set -euo pipefail
          OUT="system-a31-${{ github.event.inputs.label }}"
          cp work/system.img "work/${OUT}.img"
          mkdir work/dist
          split -b 1900M -d "work/${OUT}.img" "work/dist/${OUT}.img.part."
          printf 'Filesystem validated: %s\nRequested density: %s\nRecipe status: NOT APPLIED (safe normalization only)\nDevice boot status: NOT TESTED\n' "$(cat work/fs.txt)" "${{ github.event.inputs.lcd_density }}" > work/dist/PORT-STATUS.txt
          cp work/source.sha256 work/system.sha256 work/dist/
          cat > work/dist/HOW-TO-REJOIN.txt <<EOF
          Rejoin chunks: cat ${OUT}.img.part.* > system.img
          Normalized only; no A31 modifications or device boot validation are claimed.
          EOF
          echo '## Result' >> "$GITHUB_STEP_SUMMARY"
          cat work/dist/PORT-STATUS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: a31-gsi-normalized-image
          path: work/dist/*
