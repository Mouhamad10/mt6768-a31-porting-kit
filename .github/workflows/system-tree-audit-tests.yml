name: System tree audit tests
on:
  push:
    branches: [main]
    paths: [tools/system_tree_audit.py, tests/test_system_tree_audit.py, docs/system-tree-audit.md, .github/workflows/system-tree-audit-tests.yml]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ELF tools
        run: sudo apt-get update && sudo apt-get install -y binutils
      - name: Run analyzer smoke test
        run: python3 tests/test_system_tree_audit.py
