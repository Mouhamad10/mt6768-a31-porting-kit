name: Boot evidence extractor tests
on:
  push:
    paths:
      - 'tools/boot_evidence.py'
      - 'tests/test_boot_evidence.py'
      - '.github/workflows/boot-evidence-tests.yml'
  pull_request:
    paths:
      - 'tools/boot_evidence.py'
      - 'tests/test_boot_evidence.py'
      - '.github/workflows/boot-evidence-tests.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_boot_evidence.py' -v
