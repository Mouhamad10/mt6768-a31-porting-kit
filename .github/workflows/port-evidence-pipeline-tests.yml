name: Port Evidence Pipeline Tests
on:
  push:
    paths:
      - 'tools/port_pipeline.py'
      - 'tools/port_log_analyzer.py'
      - 'tools/evidence_correlator.py'
      - 'tools/compatibility_evidence.py'
      - 'tools/subsystem_intelligence.py'
      - 'tools/vintf_compare.py'
      - 'tools/elf_symbol_compare.py'
      - 'tools/linker_namespace_audit.py'
      - 'tools/linker_namespace_audit.py'
      - 'tests/test_port_pipeline.py'
      - 'tests/test_subsystem_intelligence.py'
      - 'tests/test_vintf_compare.py'
      - 'tests/test_elf_symbol_compare.py'
      - 'tests/test_linker_namespace_audit.py'
      - 'tests/test_linker_namespace_audit.py'
      - '.github/workflows/port-evidence-pipeline-tests.yml'
  pull_request:
    paths:
      - 'tools/port_pipeline.py'
      - 'tools/port_log_analyzer.py'
      - 'tools/evidence_correlator.py'
      - 'tools/compatibility_evidence.py'
      - 'tools/subsystem_intelligence.py'
      - 'tools/vintf_compare.py'
      - 'tools/elf_symbol_compare.py'
      - 'tests/test_port_pipeline.py'
      - 'tests/test_subsystem_intelligence.py'
      - 'tests/test_vintf_compare.py'
      - 'tests/test_elf_symbol_compare.py'
      - '.github/workflows/port-evidence-pipeline-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y binutils
      - run: python -m unittest discover -s tests -p 'test_port_pipeline.py' -v
      - run: python -m unittest discover -s tests -p 'test_subsystem_intelligence.py' -v
      - run: python -m unittest discover -s tests -p 'test_vintf_compare.py' -v
      - run: python -m unittest discover -s tests -p 'test_elf_symbol_compare.py' -v
      - run: python -m unittest discover -s tests -p 'test_linker_namespace_audit.py' -v
