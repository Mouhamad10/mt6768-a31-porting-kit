name: GSI Port Workbench
on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: Direct URL to a GSI/image/archive
        required: true
        type: string
      label:
        description: Output report label
        required: false
        default: gsi-analysis
        type: string
jobs:
  intake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs erofs-utils f2fs-tools lz4 p7zip-full android-sdk-libsparse-utils
      - name: Run unit tests
        run: python3 -m unittest discover -v
      - name: Download input with limits
        env:
          GSI_URL: ${{ inputs.gsi_url }}
        run: |
          set -euo pipefail
          mkdir -p work report
          curl -fL --retry 3 --connect-timeout 30 --max-time 1200 --max-filesize 8589934592 -o work/input.bin "$GSI_URL"
          test -s work/input.bin
          file work/input.bin
      - name: Analyze payload
        run: python3 tools/gsi_workbench.py work/input.bin --out-dir report
      - name: Normalize payload and inspect filesystem
        run: |
          set -euo pipefail
          python3 tools/gsi_prepare.py work/input.bin work/normalized.img
          python3 tools/gsi_fs_inspect.py work/normalized.img --json report/filesystem-inspection.json > report/filesystem-inspection.txt
          python3 - <<'PY'
          import json
          r=json.load(open('report/filesystem-inspection.json'))
          with open('report/filesystem-inspection.md','w') as f:
              f.write('# Filesystem inspection\\n\\n')
              f.write('- Detected: **'+r.get('filesystem','unknown')+'**\\n')
              f.write('- Inspection: '+r.get('inspection','signature_only')+'\\n')
              f.write('- Compatibility: **not assessed**\\n')
              f.write('- No filesystem changes or repacking performed.\\n')
          PY
      - name: Publish summary
        run: |
          cat report/gsi-report.md >> "$GITHUB_STEP_SUMMARY"
          cat report/filesystem-inspection.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.label }}-report
          path: report/*
          if-no-files-found: error
